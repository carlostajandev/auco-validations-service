services:
  app:
    build: .
    container_name: auco-app
    ports:
      - '${PORT:-3000}:3000'
    # ${VAR:-valor} = usa la variable del entorno o del archivo .env si existe;
    # si no, el valor por defecto. Así funciona sin configurar nada.
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGO_URI: mongodb://mongo:27017/auco
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION: us-east-1
      DYNAMO_AUDIT_TABLE: ${DYNAMO_AUDIT_TABLE:-validation_audit_events}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      ENRICHMENT_BASE_URL: ${ENRICHMENT_BASE_URL:-https://open.er-api.com/v6}
      ENRICHMENT_BASE_CURRENCY: ${ENRICHMENT_BASE_CURRENCY:-USD}
      ENRICHMENT_TARGET_CURRENCIES: ${ENRICHMENT_TARGET_CURRENCIES:-COP,EUR,MXN,BRL,CLP}
      ENRICHMENT_TIMEOUT_MS: ${ENRICHMENT_TIMEOUT_MS:-3000}
      ENRICHMENT_MAX_RETRIES: ${ENRICHMENT_MAX_RETRIES:-2}
      ENRICHMENT_CACHE_TTL_MS: ${ENRICHMENT_CACHE_TTL_MS:-600000}
      ENRICHMENT_CACHE_MAX_STALE_MS: ${ENRICHMENT_CACHE_MAX_STALE_MS:-86400000}
    depends_on:
      mongo:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: auco-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: auco-dynamodb
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-dbPath', '/home/dynamodblocal/data']
    working_dir: /home/dynamodblocal
    user: root
    ports:
      - '8000:8000'
    volumes:
      - dynamo-data:/home/dynamodblocal/data
    # Java tarda unos segundos en abrir el puerto. DynamoDB responde 400 a un
    # GET simple: cualquier respuesta HTTP significa que ya está escuchando.
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:8000 || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mongo-data:
  dynamo-data:
